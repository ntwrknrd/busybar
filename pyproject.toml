[project]
name = "busybar-monitor"
version = "0.1.0"
description = "Display macOS CPU and memory usage on a BUSY Bar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "busylib>=1.3.0,<2",
    "psutil>=7.0,<8",
]

[project.scripts]
busybar-monitor = "busybar_monitor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/busybar_monitor"]

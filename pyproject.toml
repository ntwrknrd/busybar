[project]
name = "busybar"
version = "0.1.0"
description = "Run applications on a Flipper BUSY Bar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "busylib>=1.3.0,<2",
    "psutil>=7.0,<8",
]

[project.scripts]
busybar = "busybar.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/busybar"]
